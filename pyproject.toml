[project]
name = "ai-video-maker-tools"
version = "0.1.0"
description = "Ferramentas Python do Editor de Video IA — scripts, validacao, Manim"
requires-python = ">=3.12"
dependencies = [
    "manim>=0.20.1,<0.21",
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Aceita as duas grafias. O repositorio ja tem testes nas duas formas
# (validar_manifesto_test.py e *_selftest.py), e um padrao que nao casa faz o
# pytest coletar zero testes e sair com codigo 5 -- que o gate le como falha,
# sem distinguir "quebrou" de "nao rodou nada".
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "manim: marks tests that require Manim engine",
]
